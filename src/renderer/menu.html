<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'">
    <title>Menu</title>
</head>

<!-- The padding is transparent room for the CSS shadow, reported as the "inset". -->

<body class="bg-transparent overflow-hidden select-none p-3 m-0">
    <div id="row-menu"
        class="w-max rounded-lg bg-white shadow-[0_10px_30px_-5px_rgba(0,0,0,0.35)] ring-1 ring-black/5 dark:bg-gray-700 dark:ring-white/10">
        <ul id="row-menu-items" class="py-1.5 text-sm text-gray-700 dark:text-gray-200"></ul>
    </div>
</body>

</html>
